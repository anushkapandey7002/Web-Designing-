<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .container{
         border: 2px solid black;
         padding: 10px;
         width: 95%;
         margin: 20px auto;
      }
        header {
        display: block;
        background: lightgray;
        padding: 15px;
        text-align: center;
        font-size: 20px;
      }
      header span {
        display: inline;
        color: red;
      }
      .first_line ul {
        list-style: none;
        padding: 10px;
        margin: 0;
      }
      .first_line li{
        display:inline-block;
        margin-right: 10px;
      }
      .first_line a{
        background-color:lightblue;
        padding: 5px 10px;
        border-radius:0%;
      }
      .second_line ul {
        list-style: none;
        padding: 10px;
        margin: 0;
      }
      .second_line li{
        display:inline-block;
        margin-right: 10px;
      }
      .second_line a{
        background-color:lightgreen;
        padding: 5px 10px;
        border-radius: 0%;
      }
      .clear{
        clear:both;
      }

</style>
</head>
<body>
    <div class="container">
    <header>My <span style="color:red"> Website </span>Navigation</header>
    <nav class="first_line">
          <ul>
                <li><a href=""> Home</a></li>
                <li><a href=""> About</a></li>
                <li><a href=""> Services</a></li>
                 <li><a href=""> Contact</a></li>
           </ul>
      </nav>
      <nav class="second_line">
            <ul>
                <li><a href=""> Dashborad</a></li>
                <li><a href=""> Profile</a></li>
                <li><a href=""> Messages</a></li>
                 <li><a href=""> Logout</a></li>
          </ul>
      </nav>
        <div class="clear"></div>
    </div>
     <hr />
    <h1>Anushka Pandey</h1>
    <h2>2025B01010690</h2>
</body>
</html>
