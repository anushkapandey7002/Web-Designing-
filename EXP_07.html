<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Navigation Menu</title>
    <style>
      .container {
        border: 2px solid black;
        padding: 10px;
        width: 95%;
        margin: 20px auto;
      }
      header {
        display: block;
        background: lightgray;
        padding: 15px;
        text-align: center;
        font-size: 20px;
      }
      header span {
        display: inline;
        color: red;
      }
      .inline-block-menu ul {
        list-style: none;
        padding: 10px;
        margin: 0;
      }
      .inline-block-menu li {
        display: inline-block;
        margin-right: 10px;
      }
      .inline-block-menu a {
        text-decoration: none;
        padding: 5px 10px;
        background: lightblue;
        border-radius: 0px;
      }
      .float-menu ul {
        list-style: none;
        padding: 10px;
        margin: 0;
      }
      .float-menu li {
        float: left;
        margin-right: 10px;
      }
      .float-menu a {
        text-decoration: none;
        padding: 5px 10px;
        background: lightgreen;
      }
      .clear {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <header>My <span>Website</span> Navigation</header>

      <nav class="inline-block-menu">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <nav class="float-menu">
        <ul>
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">Profile</a></li>
          <li><a href="#">Messages</a></li>
          <li><a href="#">Logout</a></li>
        </ul>
        <div class="clear"></div>
      </nav>
    </div>
    <hr />
    <h1>Anushka Pandey</h1>
    <h2>2025B01010690</h2>
  </body>
</html>
