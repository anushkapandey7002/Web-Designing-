<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Product Grid</title>
    <style>
      body {
        background-color: rgb(234, 233, 231);
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif; }
      .mainHeading {
        text-align: center;
        margin-top: 20px;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        padding: 20px;
        margin: auto;
      }
      .box {
        background-color: white;
        padding: 15px;
        box-shadow: 2px 2px 10px grey;
        border-radius: 7px;
        text-align: center;
      }
      .price {
        font-weight: bold;}
      @media (max-width: 1024px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }}
      @media (max-width: 600px) {
        .product-grid {
          grid-template-columns: 1fr;
        } }
    </style>
  </head>
  <body>
    <h1 class="mainHeading">Responsive Product Grid</h1>
    <div class="product-grid">
      <div class="box">
        <img src="" alt="" />
        <h3>Product 1</h3>
        <p>High-quality item with great features.</p>
        <h4 class="price">&#8377;499</h4>
      </div>
      <div class="box">
        <img src="" alt="" />
        <h3>Product 2</h3>
        <p>Durable and stylish for daily use.</p>
        <h4 class="price">&#8377;799</h4>
      </div>
      <div class="box">
        <img src="" alt="" />
        <h3>Product 3</h3>
        <p>Lightweight and comfortable.</p>
        <h4 class="price">&#8377;1,299</h4>
      </div>
      <div class="box">
        <img src="" alt="" />
        <h3>Product 4</h3>
        <p>Trendy design with premium quality.</p>
        <h4 class="price">&#8377;999</h4>
      </div>
    </div>
    <hr />
    <h1>Anushka Pandey</h1>
    <h2>2025B01010690</h2>
  </body>
</html>
