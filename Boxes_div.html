<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes in Devices</title>
    <style>
.margin-box {
    background-color: rgb(243, 112, 18);
    padding : 40px;
    width: 400px;
    text-align:center;
    color: white;
    font-size: 20px;
}


.border-box {
    background-color: rgb(54, 156, 246);
    padding : 30px;

    text-align : center;
    color: white;
    font-size: 20px;
}



.padding-box {
    background-color: yellow;
    padding : 20px;
   justify-content: center;
    align-items: center;
    text-align : center;
    color: white;
    font-size: 20px;
}



.content-box {
    background-color: rgb(29, 183, 180);
    padding : 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align : center;
    color: white;
    font-size: 20px;
    height: 200px;
}





       

       
    </style>
</head>


<body style="background-color: rgb(56, 11, 88);">

    <h1 style="color:white;text-align: center;">CSS Box Model</h1>

    <div class="margin-box">Margin
        <div class="border-box">Border
            <div class="padding-box">Padding
                <div class="content-box">Content</div>
            </div>
        </div>
    </div>
    
</body>
</html>
