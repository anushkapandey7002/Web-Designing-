<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Product</title>
    <style>   
  .box{
    width: 100%;
    height: 100px;
    border: 2px solid black;
    background-color: black;
    color: white;
    display: flex;
    justify-content: center;
    margin: 10px;
    font-size: 40px;
    align-items: baseline;
    text-align: center;
}
.container{
    width: 100%;
    height: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    text-align: center;
}
.product-box{
    border: 2px solid black;
    padding: 15px;
    margin: 10px;
    width: 500px;
    max-width: 90%;
    height: auto;
    text-align: center;
}
.image{
    width: 450px;
    max-width: 6900px;
    height: auto;
    display: inline-block;
    
   
    height: 300px;
    margin: 10px;
   text-align: center;
}
.product{
    font-size: 30px;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    text-align: left;
}
.description{
    font-size: 20px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    color: rgba(160, 156, 156, 0.784);
    text-align: left;
}
.price{
    text-align: left;
}
.old-price{
    font-size: 25px;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: green;
    text-align:left;
}
.new-price{
    font-size: 25px;
    color: grey;
    text-decoration: line-through;
}
.button{
    background-color: rgb(90, 10, 238);
    width:100%;
    height: 40px;
    color: white;
    font-size: 20px;
    }
  </style>
  </head>
  <body>
  <header class="site-header">
  <div class="box">
  <p>ShopEasy</p>
  </div>
  </header>
  <main class="container">
  <div class="product-box">
  <img src="Shirt.img.png" alt="Shirt Image" class="image" />
  <h2 class="product">Classic Cotton T-Shirt</h2>
  <p class="description">
    Soft, breathable cotton,Regular fit. Available in multiple colors.
  </p>
  <p class="price">
  <span class="old-price">₹ 799</span>
  <span class="new-price">₹1,199</span>
  </p>
  <button class="button">Add to Cart</button>
  </div> 
    </main>
     <hr>
        <h1>Anushka Pandey</h1>
        <h2>2025B01010690</h2>
  </body>
</html>
