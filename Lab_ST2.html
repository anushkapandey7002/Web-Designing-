<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Responsive Product Grid</title>

<style>
  body {
        
        margin: 0;
        padding: 0;
         background-color:grey;
        font-family: Arial;
      }

    
      .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        padding: 20px;
        margin: auto;
      }

      .product-grid {
        background-color: white;
        padding: 15px;
        box-shadow: 2px 2px 10px grey;
        border-radius: 7px;
        text-align: center;
      }

      .price {
        font-weight: bold;
      }

      @media (max-width: 1024px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        .product-grid {
          grid-template-columns: 1fr;
        }
}






</style>
</head>

<body>
<div class="container">
 



  <div class="product-grid">
    <div>Product 1</div>
    <div class="Product-name"><img src="https://image.png" alt="product 1"></div>
    <div><p>This is the best product in the world.</div>
    <div class="price">&#8377;799</div> 
  </div>

 <div class="product-grid">
    <div>Product 2</div>
    <div><img src="https://image.png" alt="product 2"></div>
    <div><p>This is the second best product in the world.</div>
    <div class="price">&#8377;899</div> 
  </div>

<div class="product-grid">
    <div>Product 3</div>
    <div><img src="https://image.png" alt="product 3"></div>
    <div><p>This is the third best product in the world.</div>
    <div class="price">&#8377;999</div> 
  </div>


<div class="product-grid">
    <div>Product 4</div>
    <div><img src="https://image.png" alt="product "></div>
    <div><p>This is the fourth best product in the world.</div>
    <div class="price">&#8377;1999</div> 
  </div>


</div>

</body>
