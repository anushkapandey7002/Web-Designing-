<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase</title>
    <style>
  body {
  margin: 0;
  padding: 0;
}
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: black;
        padding: 15px;
        color: white;
      }
      .logo {
        font-size: 22px;
        font-weight: bold;
      }
      .menu {
        display: flex;
        gap: 25px;
      }
      .menu a {
        color: white;
        font-size: 15px;
      }
      .right {
        display: flex;
        gap: 20px;
      }
      .right a {
        color: white;
      }
      @media (max-width: 768px) {
        .navbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .menu {
          flex-direction: column;
        }
        .right {
          padding-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="logo">ShopEase</div>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
      </div>

      <div class="right">
        <a href="#">Cart </a>
        <a href="#">Login</a>
      </div>
    </div>
    
    <h2>Welcome to ShopEase!</h2>
    <p>Your one-stop destination for all shopping needs.</p>
    

    <hr>
    <h1>Anushka Pandey</h1>
    <h2>2025B01010690</h2>
  </body>
</html>
